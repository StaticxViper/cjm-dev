# Job Automation Opportunity Finder — configuration

# Prefer remote U.S. roles when discovering and ranking opportunities.
prioritize_remote: true
include_remote: true

# Multiple geographic regions. Hybrid/on-site jobs must match one of these.
# Remote U.S. jobs are always eligible when include_remote is true.
