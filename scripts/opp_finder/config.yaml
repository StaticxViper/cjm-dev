sources:
  google:
    enabled: true
  indeed:
    enabled: true
  ziprecruiter:
    enabled: true
  craigslist:
    enabled: true
  company_sites:
    enabled: true
  staffing:
    enabled: true

search:
  max_results_per_keyword: 25
  max_total_jobs: 250
  max_company_research: 100
  max_qualified_contacts: 50
  # Location phrases combined with keywords for Google discovery
  location_phrases:
    - "South Jersey"
    - "Camden County NJ"
    - "Burlington County NJ"
    - "Gloucester County NJ"
    - "Atlantic County NJ"
    - "Cape May County NJ"
    - "Cumberland County NJ"
    - "Salem County NJ"
    - "Mercer County NJ"
    - "Ocean County NJ"
    - "Monmouth County NJ"
    - "New Jersey remote"
  query_templates:
    - '"{keyword}" "{location}" hiring'
    - '"{keyword}" "{location}" job'
    - 'CAREERS "{keyword}" "{location}"'
    - 'JOB "{keyword}" "{location}"'

qualification:
  minimum_automation_score: 55
  minimum_opportunity_score: 60

browser:
  headless: true
  timeout_seconds: 30
  navigation_retries: 1
  delay_min_seconds: 2.5
  delay_max_seconds: 6.0
  screenshot_on_error: false

output:
  all_jobs: "output/all_jobs.csv"
  qualified: "output/qualified_opportunities.csv"
  search_history: "output/search_history.csv"

outreach:
  sender_name: "CJ"
