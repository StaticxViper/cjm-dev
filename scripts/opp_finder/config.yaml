sources:
  google:
    enabled: true
  indeed:
    enabled: true
  ziprecruiter:
    enabled: true
  craigslist:
    enabled: true
  company_sites:
    enabled: true
  staffing:
    enabled: true

search:
  max_results_per_keyword: 25
  max_total_jobs: 250
  max_company_research: 100
  max_qualified_contacts: 50
  # Remote phrases are searched first when prioritize_remote is true.
  remote_phrases:
    - "Remote United States"
    - "Remote US"
    - "Work from home United States"
    - "Fully remote US"
    - "United States remote"
    - "New Jersey remote"
    - "Philadelphia remote"
  # Optional extra local phrases (regions also contribute search_phrases).
  location_phrases: []
  query_templates:
    - '"{keyword}" "{location}" hiring'
    - '"{keyword}" "{location}" job'
    - 'CAREERS "{keyword}" "{location}"'
    - 'JOB "{keyword}" "{location}"'

qualification:
  minimum_automation_score: 55
  minimum_opportunity_score: 60

browser:
  headless: true
  timeout_seconds: 30
  navigation_retries: 1
  delay_min_seconds: 2.5
  delay_max_seconds: 6.0
  screenshot_on_error: false

output:
  all_jobs: "output/all_jobs.csv"
  qualified: "output/qualified_opportunities.csv"
  search_history: "output/search_history.csv"

outreach:
  sender_name: "CJ"
