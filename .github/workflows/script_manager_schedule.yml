# Generated cron block: python -m scripts.script_manager schedules --write
name: Script Manager Schedules

on:
  schedule:
    # script-manager:schedules:begin
    - cron: '0 14 * * 1-5'
    # script-manager:schedules:end
  workflow_dispatch:
    inputs:
      cron:
        description: Run the scripts for this cron line, as if it fired. Empty uses the last 90 minutes
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.due.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/requirements.txt
      # github.event.schedule is the cron line that fired. GitHub often starts
      # scheduled runs hours late, so matching on it is reliable and the clock is not.
      - name: Scripts due now
        id: due
        env:
          SCRIPT_MANAGER_FIRED_CRON: ${{ github.event.schedule || inputs.cron }}
        run: python -m scripts.script_manager schedules --due --cron "$SCRIPT_MANAGER_FIRED_CRON" --github-output

  run:
    needs: due
    if: needs.due.outputs.matrix != '{"include":[]}' && needs.due.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.due.outputs.matrix) }}
    uses: ./.github/workflows/script_manager.yml
    with:
      script: ${{ matrix.script }}
      confirm: ${{ matrix.confirm }}
      outputs: ${{ matrix.outputs }}
      request_id: schedule-${{ matrix.script }}-${{ github.run_id }}
      caller: script-manager-schedule
    secrets: inherit
