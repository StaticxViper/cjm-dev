name: Apify Actor tests

# PR and main-branch tests run in ci.yml. This workflow is manual only.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/requirements.txt
      - name: Unit tests
        run: python -m unittest unittests.apify_scripts.test_city_data_actor unittests.apify_scripts.test_google_business_actor
