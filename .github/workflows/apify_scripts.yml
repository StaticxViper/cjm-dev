name: Apify Actor tests

on:
  pull_request:
    paths:
      - "scripts/apify-scripts/**"
      - "unittests/apify_scripts/**"
      - "scripts/city_data/**"
      - "scripts/lead_automation/crm_enrich_match.py"
      - "scripts/lead_automation/crm_enrich_robots.py"
      - "scripts/lead_automation/playwright_discovery.py"
      - "requirements/requirements.txt"
      - ".github/workflows/apify_scripts.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/apify-scripts/**"
      - "unittests/apify_scripts/**"
      - "scripts/city_data/**"
      - "scripts/lead_automation/crm_enrich_match.py"
      - "scripts/lead_automation/crm_enrich_robots.py"
      - "scripts/lead_automation/playwright_discovery.py"
      - "requirements/requirements.txt"
      - ".github/workflows/apify_scripts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements/requirements.txt
      - name: Unit tests
        run: python -m unittest unittests.apify_scripts.test_city_data_actor unittests.apify_scripts.test_google_business_actor
