name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "portfolio/**"
      - "documentation/repo-map/**"
      - "scripts/repo_map/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repo map
        run: python scripts/repo_map/generate.py --check

      - name: Build site
        run: python portfolio/build.py

      - name: Render repo map
        run: python scripts/repo_map/generate.py --pages portfolio/dist/repo-map

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
